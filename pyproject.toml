[project]
name = "mazebot"
version = "0.1.0"
description = "Wheely's maze: a tiny RL-trained differential-drive robot that navigates freehand-drawn mazes"
authors = [{ name = "Bryan Chew" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "gymnasium>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "matplotlib>=3.9",
]
train = [
    "imageio>=2.38.0",
    "pyyaml>=6.0.3",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mazebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.uv]
default-groups = ["dev", "train"]
